[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfvt-rods"
version = "0.1.0"
description = "Interactive spherocylinder and PEG phase diagrams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "tqdm"]

[project.optional-dependencies]
notebook = ["ipywidgets>=8", "ipympl>=0.9", "ipykernel"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gfvt_rods*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that run numerical GFVT solves"]
